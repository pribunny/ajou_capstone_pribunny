services:
  frontend-builder:
    build:
      context: ./front/pribunny_web
      dockerfile: Dockerfile
    command: sh -c "echo '✅ Frontend build complete'"
    volumes:
      - frontend-build:/app/dist

  backend-node:
    build:
      context: ./app/backend
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    env_file:
      - ./app/backend/.env.prod
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-build:/usr/share/nginx/html:ro
    depends_on:
      - frontend-builder
      - backend-node

volumes:
  frontend-build: